stages:
  - secret-detection
  - unit-test
  - build
  - deploy

image: maven:3.8.5-openjdk-17
variables:
  JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
  TZ: Europe/Kiev
  SECRET_DETECTION_ENABLED: 'true'
  SECRET_DETECTION_HISTORIC_SCAN: "true"

secret_detection:
  stage: secret-detection
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  artifacts:
    reports:
      secret_detection: gl-secret-detection-report.json

include:
  - template: Security/Secret-Detection.gitlab-ci.yml


unit-test:
  stage: unit-test
  services:
    - name: docker:24.0.7-dind
      command: [ "--tls=false" ]
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_DRIVER: overlay2
  script:
    - mvn clean verify -Dstyle.color=always
    - cat target/site/jacoco/index.html | grep -o 'Total[^%]*%' | sed 's/<.*>/ /; s/Total/Jacoco Coverage Total:/'
  coverage: '/Total.*?([0-9]{1,3})%/'
  only: [ web, api, merge_requests, main ]
  artifacts:
    when: always
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml
        - target/failsafe-reports/TEST-*.xml
      coverage_report:
        coverage_format: jacoco
        path: target/site/jacoco/jacoco.xml
    expire_in: 7 day


publish:
  stage: build
  script:
    - mvn deploy -s settings.xml -Dmaven.test.skip=true -Dstyle.color=always
  only: [ branches ] ##TODO

site:
  stage: build
  script:
    - mvn site
  only: [ tags, merge_requests]
  artifacts:
    paths:
      - ./target/site/


pages:
  stage: deploy
  dependencies: [ "site" ]
  script:
    - mkdir public
    - mv ./target/site/apidocs/* public
  only: [ tags ]
  artifacts:
    paths:
      - public
